name: Cloud check in action

on:
  push:
    branches: [ main ]
  watch:
    types: [ started ]
  schedule:
    - cron: '15 23 * * *'  # 北京时间 07:15
    - cron: '15 1 * * *'   # 北京时间 09:15
    - cron: '15 3 * * *'   # 北京时间 11:15
    - cron: '15 5 * * *'   # 北京时间 13:15
    - cron: '15 7 * * *'   # 北京时间 15:15
    - cron: '15 9 * * *'   # 北京时间 17:15
    - cron: '15 12 * * *'  # 北京时间 20:15
    - cron: '15 14 * * *'  # 北京时间 22:15
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      # 1. 手动拉取代码
      - name: Check out code
        run: |
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      # 2. 配置 Node.js 环境
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 判断调试模式
      - name: Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUDCHECK_VERSION=${{ github.env }}" >> $GITHUB_ENV

      # 4. 恢复缓存
      - name: Restore cached C...
        uses: actions/cache/restore@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      # 5. 注入私密环境变量
      - name: Init secrets
        uses: actions/github-script@v7
        with:
          script: |
            const secrets = ${{ toJSON(secrets) }};
            const fs = require('fs');
            let content = '';
            for (const [key, value] of Object.entries(secrets)) {
              content += `${key}=${value}\n`;
            }
            fs.writeFileSync('.env', content);

      # 6. 配置 Git 身份
      - name: Configure Git identity
        run: |
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

      # 7. 安装依赖
      - name: Init dependencies
        run: npm install

      # 8. 运行主程序
      - name: Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      # 9. 保存缓存
      - name: Save cached C...
        uses: actions/cache/save@v4
        if: success() && hashFiles('token/**.json') != ''
        with:
          path: token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('token/**.json') }}

      # 10. 清理敏感环境变量文件
      - name: Clean up secrets
        if: always()
        run: rm -f .env

      # 11. 清理旧的工作流记录
      - name: Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 50
