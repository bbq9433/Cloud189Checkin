name: Cloud check in action
on:
  push:
    branches: [ main ]
  watch:
    types: [ started ]
  schedule:
    - cron: '15 0 * * *'   # 北京时间 08:15
    - cron: '15 12 * * *'  # 北京时间 20:15
jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Check out code
        run: |
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUDCHECK_VERSION=${{ github.env }}" >> $GITHUB_ENV

      - name: Restore cached C...
        uses: actions/cache/restore@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      - name: Init secrets
        uses: actions/github-script@v7
        with:
          script: |
            const secrets = ${{ toJSON(secrets) }};
            const fs = require('fs');
            let content = '';
            for (const [key, value] of Object.entries(secrets)) {
              content += `${key}=${value}\n`;
            }
            fs.writeFileSync('.env', content);

      - name: Configure Git identity
        run: |
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }}"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

      - name: Init dependencies
        run: npm install

      - name: Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      - name: Save cached C...
        uses: actions/cache/save@v4
        if: success() && hashFiles('token/**.json') != ''
        with:
          path: token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('token/**.json') }}

      # 删除敏感文件，保护账号安全
      - name: Clean up secrets
        if: always()
        run: rm -f .env

      # 删除旧的保活步骤（建议删除或注释掉）
      # - name: Keep Running
      #   if: github.event_name == 'schedule'
      #   run: |
      #     git pull --rebase --autostash
      #     git commit --allow-empty -m "Keep Running..."
      #     git push

      - name: Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7          # 改为保留 7 天内的记录，更安全
          keep_minimum_runs: 50
