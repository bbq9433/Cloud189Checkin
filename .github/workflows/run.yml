name: Cloud check in action
on:
  push:
    branches: [ main ]
  watch:
    types: [ started ]
  schedule:
    - cron: 35 2 * * * # Runs at 02:35

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: user
    steps:
      # 1. 关键修复：改用 actions/checkout@v4，且加入 lfs: false 彻底绕过“下载 3.6.0”的报错
      - name: Check out code
        uses: actions/checkout@v4
        with:
          lfs: false

      # 2. 修复警告：升级 actions/setup-node 到 v4，解决 Node 16 过时提示
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUDCHECK_VERSION=${{ github.env }}" >> $GITHUB_ENV

      - name: Restore cached C...
        uses: actions/cache/restore@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      - name: Init secrets
        run: |
          echo "${{ toJSON(secrets) }}" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> .env

      - name: Init dependencies
        run: npm install

      # 3. 修复警告：升级 retry 到 v3，解决 Node 16 过时提示
      - name: Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      - name: Save cached C...
        uses: actions/cache/save@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('token/**.json') }}

      - name: Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      - name: Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
