name: Cloud check in action
on:
  push:
    branches: [ main ]
  watch:
    types: [ started ]
  schedule:
    - cron: '35 2 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    environment: user
    steps:
      # 1. 关键修复：弃用 actions/checkout，改用原生 git clone，彻底解决 git-lfs 3.6.0 Bug
      - name: Check out code
        run: |
          git clone --depth 1 https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .

      # 2. 配置 Node 环境（升级到 v4，修复 Node 16 提示）
      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 调试判断
      - name: Check if Debug is true
        if: vars.debug == '1'
        run: |
          echo "CLOUDCHECK_VERSION=${{ github.env }}" >> $GITHUB_ENV

      # 4. 恢复缓存
      - name: Restore cached C...
        uses: actions/cache/restore@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token
          restore-keys: ${{ runner.os }}-cache-token-

      # 5. 关键修复：抛弃死掉的第三方插件，改用 GitHub 官方内置脚本注入环境变量
      - name: Init secrets
        uses: actions/github-script@v7
        with:
          script: |
            const secrets = ${{ toJSON(secrets) }};
            const fs = require('fs');
            let content = '';
            for (const [key, value] of Object.entries(secrets)) {
              content += `${key}=${value}\n`;
            }
            fs.writeFileSync('.env', content);

      # 6. 安装依赖
      - name: Init dependencies
        run: npm install

      # 7. 运行主程序
      - name: Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      # 8. 保存缓存
      - name: Save cached C...
        uses: actions/cache/save@v4
        with:
          path: token
          key: ${{ runner.os }}-cache-token-${{ hashFiles('token/**.json') }}

      # 9. 保持运行（用于定时任务）
      - name: Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push

      # 10. 清除旧的运行记录
      - name: Delete old workflow run
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
